<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roman — Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<main id="scroll">
  <section class="s hero">
    <h1>ROMAN</h1>
    <p class="sub">noir &middot; british trip-hop &middot; written &amp; produced</p>
    <p class="cue">scroll</p>
  </section>
  <section class="s left">
    <p class="line">songs from the hour<br>when the city stops <em>pretending</em>.</p>
  </section>
  <section class="s spacer"></section>
  <section class="s right">
    <p class="line">every song is a room.<br><em>every room has its own weather.</em></p>
  </section>
  <section class="s spacer"></section>
  <section class="s final">
    <div class="card">
      <div class="k">track 01</div>
      <h2>when god wants<br>to make you stronger</h2>
      <div class="meta">6:03 &middot; D minor &middot; 68 bpm</div>
      <button id="enter" data-song="0">&#9654;&nbsp; enter the song</button>
    </div>
  </section>
</main>

<div id="player" hidden>
  <button id="back" title="Esc">&larr; city</button>
  <div id="ptitle"></div>
  <div id="taphint"></div>
  <div id="pbottom">
    <div id="bar"><div id="fill"></div></div>
    <div id="pctl">
      <button id="pp" title="Space">&#10074;&#10074;</button>
      <span id="clock">0:00</span>
      <span class="grow"></span>
      <button id="tap" title="Enter stamps the next line">tap-sync</button>
      <button id="save">save .lrc</button>
    </div>
  </div>
</div>

<div id="fade"></div>
<div id="loading">lighting the city&hellip;</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
