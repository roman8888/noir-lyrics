<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roman — When God Wants to Make You Stronger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=20261010211903">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="glass"></canvas>

<header id="titles">
  <h1>Roman</h1>
  <p>When God Wants to Make You Stronger</p>
</header>
<div id="count"></div>

<aside id="lyrics" class="open"><div id="lyhead"><span>Lyrics</span><button id="lytoggle" aria-label="Hide lyrics">&times;</button></div><ol id="lylist"></ol></aside>
<button id="lyopen" hidden>lyrics</button>
<div id="player" hidden>
  <div id="pbottom">
    <div id="bar"><div id="fill"></div></div>
    <div id="pctl">
      <button id="pp" aria-label="Play or pause">pause</button>
      <span id="clock">0:00</span>
      <span class="grow"></span>
      <span id="tools" hidden>
        <button id="tap" title="Enter stamps the next line">tap-sync</button>
        <button id="save">save .lrc</button>
      </span>
    </div>
  </div>
  <div id="taphint"></div>
</div>

<div id="ending" hidden>
  <button id="again">play again</button>
</div>
<div id="loading"></div>

<script type="module" src="js/main.js?v=20261010211903"></script>
</body>
</html>
