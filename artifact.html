<title>When God Wants to Make You Stronger</title>
<style>:root{color-scheme:dark;background:#050608} body{background:#050608}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<canvas id="gl"></canvas>
<canvas id="glass"></canvas>

<header id="titles">
  <h1>Roman</h1>
  <p>When God Wants to Make You Stronger</p>
</header>
<div id="count"></div>

<div id="player" hidden>
  <div id="ptitle"><b>Roman</b> &mdash; <i>When God Wants to Make You Stronger</i></div>
  <div id="pbottom">
    <div id="bar"><div id="fill"></div></div>
    <div id="pctl">
      <button id="pp" aria-label="Play or pause">pause</button>
      <span id="clock">0:00</span>
      <span class="grow"></span>
      <span id="tools" hidden>
        <button id="tap" title="Enter stamps the next line">tap-sync</button>
        <button id="save">save .lrc</button>
      </span>
    </div>
  </div>
  <div id="taphint"></div>
</div>

<button id="listen" hidden>tap to listen</button>
<div id="ending" hidden>
  <h2>Roman</h2>
  <p>When God Wants to Make You Stronger</p>
  <button id="again">play again</button>
</div>
<div id="loading"></div>

<script type="module" src="js/main.js"></script>
